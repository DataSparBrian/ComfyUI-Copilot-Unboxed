name: Upstream Sync Check

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:  # Allow manual triggering

jobs:
  check-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git operations

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configure upstream remote
        run: |
          git remote add upstream https://github.com/AIDC-AI/ComfyUI-Copilot.git || true
          git fetch upstream

      - name: Check for upstream changes
        id: check_upstream
        run: |
          python tools/upstream_monitor.py --check --verbose || echo "changes_found=false" >> $GITHUB_OUTPUT

      - name: Run privacy validator
        run: |
          python tools/privacy_validator.py --scan --strict

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-reports
          path: reports/

      - name: Create issue if changes found
        if: steps.check_upstream.outputs.changes_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'reports/upstream-changes-' + new Date().toISOString().split('T')[0] + '.md';
            const reportContent = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8')
              : 'Upstream changes detected but report file not found.';

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔄 Upstream changes detected - AIDC-AI/ComfyUI-Copilot',
              labels: ['upstream-sync', 'maintenance'],
              body: `New changes found in upstream repository. Review needed for merge compatibility.\n\n---\n\n${reportContent}`
            });
